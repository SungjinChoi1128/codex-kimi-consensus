[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consensusd"
version = "0.1.0"
description = "Local durable multi-agent consensus review daemon"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "typer>=0.9",
  "mcp>=1.27.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
consensusd = "consensusd.cli:app"

[tool.setuptools.packages.find]
include = ["consensusd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
